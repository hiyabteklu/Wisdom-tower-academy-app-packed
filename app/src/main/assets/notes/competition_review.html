<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #cbd5e1; font: 15px/1.55 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #root { padding: 2px 2px 16px; max-width: 680px; margin: 0 auto; overflow-wrap: anywhere; }
  button { font-family: inherit; cursor: pointer; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; font-size: .9rem; }

  /* the hub's own review look (quiz.html): item card, badges, choices with a mark, Official solution, Explain with AI */
  .prompt { color: #fff; font-weight: 700; margin-bottom: 12px; font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: var(--wt-content-size-question, 17px); line-height: var(--wt-content-line-question, 26px); }
  .prompt .study-p { margin: 0 0 .5em; }
  .ritem { border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(14,23,42,.72); padding: 14px; }
  .ritem.ok { border-color: rgba(52,211,153,.3); }
  .ritem.bad { border-color: rgba(251,113,133,.3); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .badge { font-size: .62rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .badge.ok { color: #6ee7b7; background: rgba(16,185,129,.2); border-color: rgba(52,211,153,.3); }
  .badge.bad { color: #fda4af; background: rgba(244,63,94,.2); border-color: rgba(251,113,133,.3); }
  .badge.skip { color: #fcd34d; background: rgba(245,158,11,.2); border-color: rgba(251,191,36,.3); }
  .rchoice { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.02); color: rgba(255,255,255,.7); font-size: .85rem; font-weight: 600; }
  .rchoice.right { border-color: rgba(52,211,153,.6); background: rgba(16,185,129,.15); color: #fff; font-weight: 800; }
  .rchoice.user { border-color: rgba(251,113,133,.6); background: rgba(244,63,94,.15); color: #fff; font-weight: 800; }
  .rchoice .cl { color: #fcd34d; font-weight: 800; margin-right: 8px; }
  .rchoice .mk { flex: none; font-size: .72rem; font-weight: 800; }
  .rchoice.right .mk { color: #6ee7b7; } .rchoice.user .mk { color: #fda4af; }

  /* Official solution and Explain with AI: the hub's two buttons, side by side in ONE row */
  .btnrow { display: flex; gap: 8px; margin-top: 6px; }
  .btnrow button { flex: 1 1 0; min-width: 0; display: block; margin: 0; text-align: center; }
  .sol { border: 1px solid rgba(52,211,153,.45); background: rgba(16,185,129,.15); color: #ecfdf5; font-size: .75rem; font-weight: 800; padding: 6px 10px; border-radius: 8px; }
  .aibtn { border: 1px solid rgba(167,139,250,.45); background: rgba(139,92,246,.15); color: #f5f3ff; font-size: .75rem; font-weight: 800; padding: 6px 10px; border-radius: 8px; }
  .aibtn:disabled { opacity: .6; }
  .solbox { margin-top: 10px; border: 1px solid rgba(52,211,153,.3); background: rgba(16,185,129,.1); border-radius: 12px; padding: 10px 12px; color: #ecfdf5; font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: var(--wt-content-size-explanation, 17px); line-height: var(--wt-content-line-explanation, 26px); font-weight: 500; }
  .solbox .lbl { margin: 0 0 4px; font: 900 .68rem/1 -apple-system, Roboto, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6ee7b7; font-style: normal; }
  .solbox .study-p { margin: .4em 0; }
  .aibox { margin-top: 10px; border: 1px solid rgba(167,139,250,.3); background: rgba(139,92,246,.1); border-radius: 12px; padding: 10px 12px; color: rgba(255,255,255,.95); font-family: var(--wt-content-font-family, "WT Tinos", serif); font-style: var(--wt-content-font-style, italic); font-size: var(--wt-content-size-explanation, 17px); line-height: var(--wt-content-line-explanation, 26px); font-weight: 500; }
  .aibox .lbl { margin: 0 0 4px; font: 900 .68rem/1 -apple-system, Roboto, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #c4b5fd; font-style: normal; }
  .aibox .study-p { margin: .4em 0; }

  /* M11 motion (docs/UI_MOTION_PLAN.md): same feel as the quiz and exam pages. Visual only, transform and opacity
     only, never blocks a tap. draw() adds the class once, right after a real change (a different question, the
     solution opening, the AI answer arriving), so an ordinary redraw never replays it. Remove animations in the
     phone settings turns it off. */
  @media (prefers-reduced-motion: no-preference) {
    .ritem.in { animation: rvIn .24s ease-out; }
    .solbox.in, .aibox.in { animation: rvBox .22s ease-out; }
    @keyframes rvIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes rvBox { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/*
 * Competition review page (C7 slice 3; slice 4 AI block; session AJ rebuilt it in the hub's review look).
 * Shows ONE reviewed question: Correct / Wrong / Skipped badge, the prompt, the choices with the right one in
 * green and a wrong pick in red (marks "Correct" and "Your Choice" like the hub), then ONE row with the hub's two
 * buttons: Official solution (closed every time a question opens, tap to open) and Explain with AI. Math is
 * drawn with the local KaTeX renderer (richtext.js).
 * The app calls window.setReview(jsonText) with { id, prompt, choices, correct, chosen (-1 = none), solution,
 * explanation, canExplain, explaining }. The page tells the app two things through window.WTReview:
 * swipe("next" or "prev") when the finger slides left or right, and explain() when Explain with AI is tapped.
 * The app keeps the AI text and sends it back as explanation. No network.
 * The server only sends correct answers and solutions after the competition window has closed.
 * Nothing is typed here that the server did not send: no solution means no solution button.
 * M11 (motion only): a new question rises in, the official solution and the AI answer fade down when they first
 * appear. Flags newQ, solIn and aiIn are one-shot and read by draw().
 */
(function () {
  var root = document.getElementById("root");
  var cur = null, lastId = null, showSol = false, startX = null, startY = null;
  var solIn = false, lastHadAi = false;

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function R(t) { try { return window.WTRich.render(String(t == null ? "" : t)); } catch (e) { return esc(t); } }
  function RI(t) { try { return window.WTRich.renderInline(String(t == null ? "" : t)); } catch (e) { return esc(t); } }
  function cleanChoice(c) { return String(c == null ? "" : c).replace(/^[A-Da-d][.)]\s*/, "").replace(/[\r\n]+/g, " ").trim(); }
  function letter(i) { return String.fromCharCode(65 + i); }
  function tell(name, arg) {
    try { if (window.WTReview && window.WTReview[name]) window.WTReview[name](arg); } catch (e) {}
  }
  /* the AI writes math as \( ... \) and \[ ... \]; the shared renderer reads $ ... $ and $$ ... $$ */
  function aiText(s) {
    return String(s == null ? "" : s)
      .replace(/\\\[([\s\S]+?)\\\]/g, function (m, a) { return "$$" + a + "$$"; })
      .replace(/\\\(([\s\S]+?)\\\)/g, function (m, a) { return "$" + a + "$"; });
  }

  function draw() {
    if (!cur) return;
    var same = (lastId === cur.id);
    var newQ = !same;
    if (!same) showSol = false;
    var keep = same ? (window.pageYOffset || 0) : 0;
    var choices = Array.isArray(cur.choices) ? cur.choices : [];
    var chosen = (typeof cur.chosen === "number") ? cur.chosen : -1;
    var skipped = chosen < 0, right = (!skipped && chosen === cur.correct);
    var h = '<div class="ritem ' + (right ? "ok" : (skipped ? "" : "bad")) + '"><div class="badges">' +
      (right ? '<span class="badge ok">Correct</span>' : "") +
      (!right && !skipped ? '<span class="badge bad">Wrong</span>' : "") +
      (skipped ? '<span class="badge skip">Skipped</span>' : "") + "</div>" +
      '<div class="prompt">' + R(cur.prompt) + "</div>";
    var i, rc, mk;
    for (i = 0; i < choices.length; i++) {
      rc = "rchoice"; mk = "";
      if (cur.correct === i) { rc += " right"; mk = "\u2713 Correct"; }
      else if (chosen === i) { rc += " user"; mk = "\u2717 Your Choice"; }
      h += '<div class="' + rc + '"><span><span class="cl">' + letter(i) + ".</span>" + RI(cleanChoice(choices[i])) + "</span>" +
        (mk ? '<span class="mk">' + mk + "</span>" : "") + "</div>";
    }
    var hasSol = !!(cur.solution && String(cur.solution).trim().length > 0);
    var canAi = (cur.canExplain === true);
    var hasAi = !!(cur.explanation && String(cur.explanation).trim().length > 0);
    if (hasSol || canAi) {
      h += '<div class="btnrow">';
      if (hasSol) h += '<button class="sol" data-act="sol">' + (showSol ? "Hide solution" : "Official solution") + "</button>";
      if (canAi) {
        h += '<button class="aibtn" data-act="ai"' + (cur.explaining ? " disabled" : "") + ">" +
          (cur.explaining ? "Generating\u2026" : (hasAi ? "Explain again" : "Explain with AI")) + "</button>";
      }
      h += "</div>";
    }
    if (hasSol && showSol) h += '<div class="solbox"><p class="lbl">Official solution</p>' + R(cur.solution) + "</div>";
    if (hasAi) h += '<div class="aibox"><p class="lbl">AI explanation</p>' + R(aiText(cur.explanation)) + "</div>";
    h += "</div>";
    root.innerHTML = h;
    /* M11: one-shot motion classes, added after the DOM is built */
    if (newQ) {
      var ri = root.querySelector(".ritem");
      if (ri) ri.classList.add("in");
    }
    if (solIn) {
      var sb = root.querySelector(".solbox");
      if (sb) sb.classList.add("in");
      solIn = false;
    }
    if (hasAi && !lastHadAi && !newQ) {
      var ab = root.querySelector(".aibox");
      if (ab) ab.classList.add("in");
    }
    lastHadAi = hasAi;
    window.scrollTo(0, keep);
    lastId = cur.id;
  }

  root.addEventListener("click", function (e) {
    var el = e.target;
    while (el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === root) return;
    var act = el.getAttribute("data-act");
    if (act === "sol") { showSol = !showSol; solIn = showSol; draw(); }
    else if (act === "ai") { tell("explain", ""); }
  });

  /* a slide to the left opens the next question, a slide to the right the previous one (same rule as the hub) */
  document.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; startX = t.clientX; startY = t.clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (startX == null) return;
    var t = e.changedTouches[0], dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null; startY = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    tell("swipe", dx < 0 ? "next" : "prev");
  }, { passive: true });

  window.setReview = function (text) {
    try {
      cur = JSON.parse(text || "{}");
      draw();
    } catch (e) {
      root.innerHTML = '<p class="msg">Could not display this question.</p>';
    }
  };
})();
</script>
</body>
</html>
