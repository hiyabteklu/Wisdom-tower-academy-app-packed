<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #e2e8f0; font: 15px/1.6 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  #root { padding: 14px 12px 20px; max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; }

  .item { margin-bottom: 14px; }
  .row { display: flex; }
  .row.usr { justify-content: flex-end; }
  .bub { border-radius: 16px; padding: 12px 14px; max-width: 100%; box-sizing: border-box; }
  .bub.b { width: 100%; background: rgba(12,22,40,.95); border: 1px solid rgba(255,255,255,.1); color: #f1f5f9; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .bub.u { max-width: 88%; background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #020617; font-weight: 500; border-bottom-right-radius: 4px; box-shadow: 0 2px 10px rgba(6,182,212,.2); }
  .bub .body > :first-child { margin-top: 0; }
  .bub .body > :last-child { margin-bottom: 0; }
  .meta { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 11px; }
  .bub.b .meta { color: #94a3b8; }
  .bub.u .meta { color: rgba(2,6,23,.7); }
  .cpy { background: transparent; border: 0; color: #94a3b8; font: 600 11px/1 -apple-system, Roboto, sans-serif; padding: 4px 6px; border-radius: 6px; }
  .cpy:active { background: rgba(255,255,255,.1); }

  .sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 0 2px; }
  .sug, .prompt { border: 1px solid rgba(34,211,238,.25); background: rgba(6,182,212,.1); color: #a5f3fc; font: 600 12px/1.3 -apple-system, Roboto, sans-serif; padding: 7px 12px; border-radius: 999px; text-align: left; }
  .sug:active, .prompt:active { background: rgba(6,182,212,.3); color: #fff; }

  #welcome { text-align: center; padding: 48px 12px 16px; }
  #welcome h3 { margin: 0; font-size: 18px; color: #fff; letter-spacing: .02em; }
  #welcome p { margin: 6px auto 0; max-width: 300px; color: #94a3b8; font-size: 12px; line-height: 1.5; }
  #welcome .prompts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }

  #think { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; background: rgba(12,22,40,.95); border: 1px solid rgba(34,211,238,.25); color: #e2e8f0; }
  #think .t { font-size: 12px; font-weight: 600; color: #67e8f9; letter-spacing: .02em; }
  #think .dots { display: inline-flex; gap: 4px; }
  #think .dots i { width: 6px; height: 6px; border-radius: 50%; background: #22d3ee; display: block; animation: bn 1s infinite ease-in-out; }
  #think .dots i:nth-child(1) { animation-delay: -.3s; }
  #think .dots i:nth-child(2) { animation-delay: -.15s; }
  @keyframes bn { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-5px); opacity: 1; } }
</style>
</head>
<body>
<div id="root">
  <div id="welcome" style="display:none">
    <h3>Wisdom Tower AI Tutor</h3>
    <p>Ask any academic concept, formula, derivation, or Ethiopian exam problem.</p>
    <div class="prompts">
      <button class="prompt" data-prompt="Ethiopian university GPA calculation">Ethiopian university GPA calculation</button>
      <button class="prompt" data-prompt="Derivative power rule step-by-step">Derivative power rule step-by-step</button>
      <button class="prompt" data-prompt="Newton's Laws with worked examples">Newton's Laws with worked examples</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="think" style="display:none"><span class="t">Thinking</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
</div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/* AI tutor message list (plan step N10). The page cannot reach the network or keep data; the app owns the chats.
 * App -> page: window.wtTutorSet(json)  json = { sid, busy, thinking, messages:[{id, role, content, timestamp, suggestions}] }
 * page -> App: WTBridge.onSend(text) (a suggestion or example prompt was tapped), WTBridge.onCopy(text).
 * Only the messages that changed are redrawn, so a streaming answer stays smooth. */
var els = {}, order = [], msgs = {}, sid = "", cur = null, copiedId = "", copyTimer = 0;

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* the AI may write math as \( ... \) and \[ ... \]; the shared renderer reads $ ... $ and $$ ... $$ */
function aiText(s) {
  return String(s == null ? "" : s)
    .replace(/\\\[([\s\S]+?)\\\]/g, function (m, a) { return "$$" + a + "$$"; })
    .replace(/\\\(([\s\S]+?)\\\)/g, function (m, a) { return "$" + a + "$"; });
}
function rich(s) {
  try { return window.WTRich.render(aiText(s)); } catch (e) { return "<p>" + esc(s) + "</p>"; }
}
function sigOf(m, showSug) {
  return m.content.length + "|" + (m.suggestions || []).join("\u0001") + "|" + (showSug ? 1 : 0) + "|" + (copiedId === m.id ? 1 : 0);
}
function msgHtml(m, showSug) {
  var bot = m.role === "assistant";
  var h = '<div class="row ' + (bot ? "bot" : "usr") + '"><div class="bub ' + (bot ? "b" : "u") + '"><div class="body">' + rich(m.content) +
    '</div><div class="meta"><span>' + esc(m.timestamp) + "</span>" +
    (bot ? '<button class="cpy" data-copy="' + esc(m.id) + '">' + (copiedId === m.id ? "Copied" : "Copy") + "</button>" : "") +
    "</div></div></div>";
  if (bot && showSug && m.suggestions && m.suggestions.length) {
    h += '<div class="sugs">' + m.suggestions.slice(0, 3).map(function (s) {
      return '<button class="sug" data-sug="' + esc(s) + '">\u2726 ' + esc(s) + "</button>";
    }).join("") + "</div>";
  }
  return h;
}

function apply(s, forceScroll) {
  var list = document.getElementById("list");
  var nearBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 140);
  var reset = s.sid !== sid;
  sid = s.sid;
  var ms = s.messages || [];
  document.getElementById("welcome").style.display = ms.length ? "none" : "";
  var ok = !reset && order.length <= ms.length;
  for (var k = 0; ok && k < order.length; k++) { if (order[k] !== ms[k].id) ok = false; }
  if (!ok) { list.innerHTML = ""; els = {}; order = []; msgs = {}; }
  for (var i = 0; i < ms.length; i++) {
    var m = ms[i];
    msgs[m.id] = m;
    var latestBot = m.role === "assistant" && i === ms.length - 1;
    var showSug = !(s.busy && latestBot);
    var sg = sigOf(m, showSug);
    var el = els[m.id];
    if (!el) {
      el = document.createElement("div");
      el.className = "item";
      el._sig = "";
      list.appendChild(el);
      els[m.id] = el;
    }
    if (el._sig !== sg) { el.innerHTML = msgHtml(m, showSug); el._sig = sg; }
  }
  order = ms.map(function (m) { return m.id; });
  document.getElementById("think").style.display = s.thinking ? "inline-flex" : "none";
  if (reset || forceScroll || nearBottom) window.scrollTo(0, document.body.scrollHeight + 100000);
}

window.wtTutorSet = function (json) {
  var s;
  try { s = JSON.parse(json); } catch (e) { return; }
  cur = s;
  apply(s, false);
};

document.addEventListener("click", function (e) {
  var t = e.target && e.target.closest ? e.target.closest("[data-sug],[data-prompt],[data-copy]") : null;
  if (!t || !window.WTBridge) return;
  var sug = t.getAttribute("data-sug") || t.getAttribute("data-prompt");
  if (sug) { if (window.WTBridge.onSend) window.WTBridge.onSend(sug); return; }
  var id = t.getAttribute("data-copy");
  if (id && msgs[id] && window.WTBridge.onCopy) {
    window.WTBridge.onCopy(msgs[id].content);
    copiedId = id;
    if (cur) apply(cur, false);
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copiedId = ""; if (cur) apply(cur, false); }, 2000);
  }
});
</script>
</body>
</html>
