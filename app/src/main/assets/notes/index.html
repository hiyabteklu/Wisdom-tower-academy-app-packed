<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #cbd5e1; font: 16px/1.7 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  #root { padding: 16px 16px 64px; max-width: 760px; margin: 0 auto; overflow-wrap: anywhere; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/* Short-notes page (plan step N6). The renderer lives in richtext.js (shared with flashcards). Called from the app: window.setNote(text). */
window.setNote = function (text) {
  var root = document.getElementById("root");
  try {
    root.innerHTML = window.WTRich.render(text);
  } catch (e) {
    root.innerHTML = '<p class="msg">Could not display this note.</p>';
  }
  window.scrollTo(0, 0);
};
</script>
</body>
</html>
