<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  /* F1g (2026-10-12): NORMAL FLOW like notes/index.html and quiz.html. The F2 version used html/body height:100% +
   * overflow:hidden + a full-height flex column; on the owner's phone the deck stayed completely dark. The card now has
   * its own explicit height (56vh, at least 300px), so it can never collapse to nothing. */
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #cbd5e1; font: 16px/1.6 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
  #root { box-sizing: border-box; padding: 6px 12px 16px; max-width: 640px; margin: 0 auto; overflow-wrap: anywhere; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; font-size: .95rem; margin: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: .75rem; margin-bottom: 6px; }
  .chip { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 3px 8px; color: #94a3b8; }
  .chip.know { border-color: rgba(52,211,153,.25); color: #a7f3d0; }
  .chip.learning { border-color: rgba(251,191,36,.25); color: #fde68a; }
  .chip.again { border-color: rgba(251,113,133,.25); color: #fecdd3; }

  /* M8 (2026-10-16, docs/UI_MOTION_PLAN.md): the flip turns the card around its vertical axis (rotateY, perspective on the
   * slot). Still NO backface-visibility and NO preserve-3d: only ONE face is shown at a time and the faces are swapped
   * while the card is edge-on (script below), so a missing 3D transform can never hide the answer (the F1d lesson).
   * To go back to the old flat squeeze, replace the fcTurn keyframes by: 0% scaleX(1), 50% scaleX(.04), 100% scaleX(1). */
  .slot { position: relative; height: 56vh; min-height: 300px; perspective: 900px; animation: fcIn .26s cubic-bezier(.22,1,.36,1); cursor: pointer; }
  .slot.from-r { animation-name: fcInR; }
  .slot.from-l { animation-name: fcInL; }
  .slot.dragging { animation: none; }
  .flip { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .flip.turn { animation: fcTurn .34s ease-in-out; }
  .face { position: absolute; top: 0; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 22px; padding: 18px 20px;
          border: 1px solid rgba(255,255,255,.12); background: linear-gradient(160deg, #131f38, #0e172a 60%, #0a101d);
          display: flex; flex-direction: column; overflow-y: auto; }
  .face.back { display: none; border-color: rgba(34,211,238,.35); }
  .flip.flipped .face.front { display: none; }
  .flip.flipped .face.back { display: flex; }
  @keyframes fcIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fcInR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes fcInL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes fcTurn { 0% { transform: rotateY(0deg); } 49.9% { transform: rotateY(90deg); } 50% { transform: rotateY(-90deg); } 100% { transform: rotateY(0deg); } }

  .lbl { flex: 0 0 auto; margin: 0 0 8px; text-align: center; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
  .lbl.q { color: #c4b5fd; }
  .lbl.a { color: #67e8f9; }
  /* text sits in the middle of the card; auto margins collapse when the text is longer than the card, so it scrolls */
  .mid { margin: auto 0; text-align: center; }
  .fc-text { color: #fff; font-family: var(--wt-content-font-family, "WT Tinos", serif); font-weight: 700; font-style: var(--wt-content-font-style, italic); font-size: var(--wt-content-size-flashcard, 20px); line-height: var(--wt-content-line-flashcard, 28px); }
  .fc-text.s1, .fc-text.s2, .fc-text.s3 { font-size: var(--wt-content-size-flashcard, 20px); line-height: var(--wt-content-line-flashcard, 28px); }
  .fc-text .study-p { margin: .5em 0; }
  .fc-text .study-list { display: inline-block; text-align: left; }
  .hint { text-align: center; font-size: .75rem; color: #94a3b8; margin: 10px 0 0; }

  .bar { padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .nav, .rate { display: flex; gap: 8px; }
  .nav .btn, .rate .btn { flex: 1 1 0; }
  .btn { font: 600 .95rem/1 -apple-system, Roboto, sans-serif; padding: 14px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: #e2e8f0; transition: transform .14s ease-out, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; }
  .btn.again { border-color: rgba(251,113,133,.45); color: #fecdd3; }
  .btn.learning { border-color: rgba(251,191,36,.45); color: #fde68a; }
  .btn.know { background: #10b981; border-color: #10b981; color: #0a101d; font-weight: 800; }
  .btn.violet { background: #8b5cf6; border-color: #8b5cf6; color: #fff; font-weight: 800; padding: 14px 22px; }
  .done { margin: 24px 0; border: 1px solid rgba(255,255,255,.12); background: #0e172a; border-radius: 20px; padding: 28px 24px; text-align: center; animation: fcIn .32s cubic-bezier(.22,1,.36,1); }
  .done .big { margin: 0 0 6px; font-size: 1.4rem; font-weight: 800; color: #fff; }
  .done .sub { margin: 0 0 18px; font-size: .95rem; color: #94a3b8; }

  @media (prefers-reduced-motion: reduce) {
    .slot, .done, .flip.turn { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"><p class="msg">Loading deck...</p></div>
<script>
/* A script error must never leave a silent dark screen: show the message on the page (the owner can read it) */
window.onerror = function (message) {
  var r = document.getElementById("root");
  if (r) r.innerHTML = '<p class="msg">Could not display this deck. (' + String(message).slice(0, 160) + ")</p>";
};
</script>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/*
 * Flashcard deck viewer (plan step N3, redesigned in F2, owner report 2026-10-12 problem 7).
 * Port of the website's components/learning/FlashcardViewer.tsx: "Question / Answer · tap to flip", counters,
 * previous / next, swipe left/right, "Deck complete" with "Practice again", empty text "No cards in this deck yet.".
 * F2: text centered in the card with a size that follows its length, a "Previous" / "Next" row and a rating row
 * "Again" / "Learning" / "Known" (the owner's wording; the website says "Know"). The stats keys sent to the app
 * are unchanged (know, learning, again, seen, total, accuracy).
 * F1c: visible errors instead of a silent dark screen. F1d: no preserve-3d / backface. F1g: normal page flow, fixed card height.
 * M8 (motion only): the card follows the finger while swiping, flies off when the swipe counts and springs back when it
 * does not; the next card slides in from the side it came from; the flip turns around the vertical axis.
 * Called from the app: window.setDeck(metaJsonText) with the row's `meta` JSON ({ "cards": [ { front, back } ] }).
 * Progress goes back to the app through window.WTBridge.onProgress(json) (the app saves it to learning_progress).
 */
(function () {
  var root = document.getElementById("root");
  var cards = [], i = 0, flipped = false, grades = {}, done = false;
  var startX = null, startY = null;
  var dragEl = null, dragging = false, dx = 0, busy = false, suppressClick = false;

  function R(t) {
    try { return window.WTRich.render(String(t == null ? "" : t)); } catch (e) { return ""; }
  }

  /* text size class by length: short = big, long = smaller, so the text always sits balanced in the card */
  function sz(t) {
    var n = String(t == null ? "" : t).length;
    return n > 260 ? " s3" : (n > 120 ? " s2" : " s1");
  }

  function face(cls, label, lc, text) {
    return '<div class="face ' + cls + '"><p class="lbl ' + lc + '">' + label + " · tap to flip</p>" +
      '<div class="mid"><div class="fc-text' + sz(text) + '">' + R(text) + "</div></div></div>";
  }

  function stats() {
    var know = 0, learning = 0, again = 0, seen = 0, k;
    for (k in grades) {
      if (!Object.prototype.hasOwnProperty.call(grades, k)) continue;
      seen++;
      if (grades[k] === "know") know++;
      else if (grades[k] === "learning") learning++;
      else again++;
    }
    return { know: know, learning: learning, again: again, seen: seen, total: cards.length, accuracy: seen ? Math.round((know / seen) * 100) : 0 };
  }

  function report() {
    if (window.WTBridge && window.WTBridge.onProgress) {
      try { window.WTBridge.onProgress(JSON.stringify(stats())); } catch (e) {}
    }
  }

  /* dir: "r" = the new card comes in from the right (forward), "l" = from the left (back), none = a small rise */
  function draw(dir) {
    if (!cards.length) { root.innerHTML = '<p class="msg">No cards in this deck yet.</p>'; return; }
    var s = stats();
    if (done) {
      root.innerHTML = '<div class="done"><p class="big">Deck complete</p><p class="sub">Known ' + s.know + " · Learning " + s.learning +
        " · Again " + s.again + '</p><button class="btn violet" data-act="restart">Practice again</button></div>';
      return;
    }
    var c = cards[i];
    root.innerHTML =
      '<div class="chips"><span class="chip">' + (i + 1) + "/" + cards.length + '</span><span class="chip know">Known ' + s.know +
      '</span><span class="chip learning">Learning ' + s.learning + '</span><span class="chip again">Again ' + s.again + "</span></div>" +
      '<div class="slot' + (dir ? " from-" + dir : "") + '" data-act="flip"><div class="flip' + (flipped ? " flipped" : "") + '" id="flip">' +
      face("front", "Question", "q", c.front) + face("back", "Answer", "a", c.back) + "</div></div>" +
      '<p class="hint">Swipe left/right to change card · Tap to flip</p>' +
      '<div class="bar"><div class="nav"><button class="btn" data-act="prev"' + (i === 0 ? " disabled" : "") + '>‹ Previous</button>' +
      '<button class="btn" data-act="next"' + (i >= cards.length - 1 ? " disabled" : "") + '>Next ›</button></div>' +
      '<div class="rate"><button class="btn again" data-act="again">Again</button><button class="btn learning" data-act="learning">Learning</button>' +
      '<button class="btn know" data-act="know">Known</button></div></div>';
  }

  function goTo(n) {
    if (n < 0 || n >= cards.length) return;
    var dir = n > i ? "r" : "l";
    i = n; flipped = false; draw(dir);
  }

  function grade(g) {
    grades[i] = g;
    if (i < cards.length - 1) { goTo(i + 1); } else { done = true; draw(); }
    report();
  }

  function restart() {
    grades = {}; done = false; i = 0; flipped = false; draw(); report();
  }

  /* Flip: the card turns around its vertical axis (CSS animation "fcTurn", 0.34 s) and the faces are swapped while it is
   * edge-on (0.17 s). The swap happens even if the animation never runs, so the answer always appears. */
  function flipCard() {
    var f = document.getElementById("flip");
    if (!f) return;
    flipped = !flipped;
    f.classList.remove("turn");
    void f.offsetWidth;
    f.classList.add("turn");
    window.setTimeout(function () {
      var g = document.getElementById("flip");
      if (!g) return;
      if (flipped) g.classList.add("flipped"); else g.classList.remove("flipped");
    }, 170);
  }

  root.addEventListener("click", function (e) {
    if (suppressClick || busy) return;
    var el = e.target;
    while (el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === root) return;
    var act = el.getAttribute("data-act");
    if (act === "flip") flipCard();
    else if (act === "prev") goTo(i - 1);
    else if (act === "next") goTo(i + 1);
    else if (act === "again" || act === "learning" || act === "know") grade(act);
    else if (act === "restart") restart();
  });

  /* Swipe: the card follows the finger (a little tilt and fade), a swipe of 60 px or more changes the card, anything else
   * springs back. Pulling past the first or last card is resisted (it moves a quarter of the way) and springs back. */
  document.addEventListener("touchstart", function (e) {
    if (busy || done) { startX = null; dragEl = null; return; }
    var t = e.touches[0];
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = false;
    dragEl = document.querySelector(".slot");
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (startX == null || !dragEl) return;
    var t = e.touches[0], mx = t.clientX - startX, my = t.clientY - startY;
    if (!dragging) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      if (Math.abs(mx) < Math.abs(my) * 1.2) { startX = null; dragEl = null; return; } /* vertical: leave it to the page and the card scroll */
      dragging = true;
      dragEl.classList.add("dragging");
      dragEl.style.transition = "none";
    }
    dx = mx;
    var blocked = (dx < 0 && i >= cards.length - 1) || (dx > 0 && i <= 0);
    var shown = blocked ? dx * 0.25 : dx;
    dragEl.style.transform = "translateX(" + shown + "px) rotate(" + (shown / 24) + "deg)";
    dragEl.style.opacity = String(1 - Math.min(Math.abs(shown) / 400, 0.35));
  }, { passive: true });

  function endDrag(cancelled) {
    var el = dragEl, wasDrag = dragging, d = dx;
    dragEl = null; dragging = false; startX = null; startY = null; dx = 0;
    if (!el || !wasDrag) return;
    suppressClick = true;
    window.setTimeout(function () { suppressClick = false; }, 350);
    var forward = d < 0;
    var ok = !cancelled && Math.abs(d) >= 60 && (forward ? i < cards.length - 1 : i > 0);
    if (ok) {
      busy = true;
      el.style.transition = "transform .16s ease-in, opacity .16s ease-in";
      el.style.transform = "translateX(" + (forward ? "-120%" : "120%") + ") rotate(" + (forward ? "-8deg" : "8deg") + ")";
      el.style.opacity = "0";
      window.setTimeout(function () { busy = false; goTo(i + (forward ? 1 : -1)); }, 150);
    } else {
      el.classList.remove("dragging");
      el.style.transition = "transform .34s cubic-bezier(.34,1.56,.64,1), opacity .2s";
      el.style.transform = "";
      el.style.opacity = "";
    }
  }
  document.addEventListener("touchend", function () { endDrag(false); }, { passive: true });
  document.addEventListener("touchcancel", function () { endDrag(true); }, { passive: true });

  window.setDeck = function (metaText) {
    try {
      var meta = JSON.parse(metaText || "{}");
      var list = Array.isArray(meta && meta.cards) ? meta.cards : [];
      cards = list.map(function (c) { return { front: c && c.front, back: c && c.back }; });
      i = 0; flipped = false; grades = {}; done = false; busy = false;
      draw();
      if (cards.length) report();
    } catch (e) {
      root.innerHTML = '<p class="msg">Could not display this deck. (' + String(e && e.message || e).slice(0, 160) + ")</p>";
    }
  };
})();
</script>
</body>
</html>
