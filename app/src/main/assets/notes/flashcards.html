<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="richtext.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0a101d; }
  body { color: #cbd5e1; font: 16px/1.6 -apple-system, Roboto, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #root { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; overflow-wrap: anywhere; }
  .msg { text-align: center; color: #94a3b8; padding: 40px 0; font-size: .9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; font-size: .75rem; margin-bottom: 12px; }
  .chip { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 4px 10px; color: #94a3b8; }
  .chip.know { border-color: rgba(52,211,153,.25); color: #a7f3d0; }
  .chip.learning { border-color: rgba(251,191,36,.25); color: #fde68a; }
  .chip.again { border-color: rgba(251,113,133,.25); color: #fecdd3; }
  .card { min-height: 300px; box-sizing: border-box; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,.12);
          background: linear-gradient(160deg, #131f38, #0e172a 60%, #0a101d); animation: fcIn .22s ease-out; }
  .card.back { border-color: rgba(34,211,238,.35); }
  @keyframes fcIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .lbl { margin: 0 0 10px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
  .lbl.q { color: #c4b5fd; }
  .lbl.a { color: #67e8f9; }
  .fc-text { color: #fff; font: italic 700 1.15rem/1.4 Georgia, "Times New Roman", serif; }
  .fc-text .study-p { margin: .5em 0; }
  .hint { text-align: center; font-size: .7rem; color: #94a3b8; margin: 10px 0 0; }
  .bar { position: sticky; bottom: 0; background: #0a101d; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 8px; }
  .grp { display: flex; gap: 8px; }
  .btn { font: 600 .85rem/1 -apple-system, Roboto, sans-serif; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: transparent; color: #e2e8f0; }
  .btn:disabled { opacity: .4; }
  .btn.again { border-color: rgba(251,113,133,.4); color: #fecdd3; }
  .btn.learning { border-color: rgba(251,191,36,.4); color: #fde68a; }
  .btn.know { background: #10b981; border-color: #10b981; color: #0a101d; font-weight: 800; }
  .btn.violet { background: #8b5cf6; border-color: #8b5cf6; color: #fff; font-weight: 800; }
  .done { border: 1px solid rgba(255,255,255,.12); background: #0e172a; border-radius: 20px; padding: 24px; text-align: center; }
  .done .big { margin: 0 0 6px; font-size: 1.25rem; font-weight: 800; color: #fff; }
  .done .sub { margin: 0 0 16px; font-size: .85rem; color: #94a3b8; }
</style>
</head>
<body>
<div id="root"></div>
<script src="katex/katex.min.js"></script>
<script src="richtext.js"></script>
<script>
/*
 * Flashcard deck viewer (plan step N3). Port of the website's components/learning/FlashcardViewer.tsx:
 * "Question / Answer · tap to flip", counters Know / Learning / Again, previous / next, swipe left/right,
 * "Deck complete" with "Practice again", empty text "No cards in this deck yet.".
 * Called from the app: window.setDeck(metaJsonText) with the row's `meta` JSON ({ "cards": [ { front, back } ] }).
 * Progress goes back to the app through window.WTBridge.onProgress(json) (the app saves it to learning_progress).
 */
(function () {
  var root = document.getElementById("root");
  var cards = [], i = 0, flipped = false, grades = {}, done = false;
  var startX = null, startY = null;

  function R(t) {
    try { return window.WTRich.render(String(t == null ? "" : t)); } catch (e) { return ""; }
  }

  function stats() {
    var know = 0, learning = 0, again = 0, seen = 0, k;
    for (k in grades) {
      if (!Object.prototype.hasOwnProperty.call(grades, k)) continue;
      seen++;
      if (grades[k] === "know") know++;
      else if (grades[k] === "learning") learning++;
      else again++;
    }
    return { know: know, learning: learning, again: again, seen: seen, total: cards.length, accuracy: seen ? Math.round((know / seen) * 100) : 0 };
  }

  function report() {
    if (window.WTBridge && window.WTBridge.onProgress) {
      try { window.WTBridge.onProgress(JSON.stringify(stats())); } catch (e) {}
    }
  }

  function draw() {
    if (!cards.length) { root.innerHTML = '<p class="msg">No cards in this deck yet.</p>'; return; }
    var s = stats();
    if (done) {
      root.innerHTML = '<div class="done"><p class="big">Deck complete</p><p class="sub">Know ' + s.know + " \u00B7 Learning " + s.learning +
        " \u00B7 Again " + s.again + '</p><button class="btn violet" data-act="restart">Practice again</button></div>';
      return;
    }
    var c = cards[i];
    root.innerHTML =
      '<div class="chips"><span class="chip">' + (i + 1) + "/" + cards.length + '</span><span class="chip know">Know ' + s.know +
      '</span><span class="chip learning">Learning ' + s.learning + '</span><span class="chip again">Again ' + s.again + "</span></div>" +
      '<div class="card' + (flipped ? " back" : "") + '" data-act="flip"><p class="lbl ' + (flipped ? "a" : "q") + '">' +
      (flipped ? "Answer" : "Question") + " \u00B7 tap to flip</p><div class=\"fc-text\">" + R(flipped ? c.back : c.front) + "</div></div>" +
      '<p class="hint">Swipe left/right to change card \u00B7 Tap to flip</p>' +
      '<div class="bar"><div class="grp"><button class="btn" data-act="prev"' + (i === 0 ? " disabled" : "") + '>\u2039</button>' +
      '<button class="btn" data-act="next"' + (i >= cards.length - 1 ? " disabled" : "") + '>\u203A</button></div>' +
      '<div class="grp"><button class="btn again" data-act="again">Again</button><button class="btn learning" data-act="learning">Learning</button>' +
      '<button class="btn know" data-act="know">Know</button></div></div>';
  }

  function goTo(n) {
    if (n < 0 || n >= cards.length) return;
    i = n; flipped = false; draw(); window.scrollTo(0, 0);
  }

  function grade(g) {
    grades[i] = g;
    if (i < cards.length - 1) { goTo(i + 1); } else { done = true; draw(); }
    report();
  }

  function restart() {
    grades = {}; done = false; i = 0; flipped = false; draw(); window.scrollTo(0, 0); report();
  }

  root.addEventListener("click", function (e) {
    var el = e.target;
    while (el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
    if (!el || el === root) return;
    var act = el.getAttribute("data-act");
    if (act === "flip") { flipped = !flipped; draw(); }
    else if (act === "prev") goTo(i - 1);
    else if (act === "next") goTo(i + 1);
    else if (act === "again" || act === "learning" || act === "know") grade(act);
    else if (act === "restart") restart();
  });

  document.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; startX = t.clientX; startY = t.clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (startX == null || done) return;
    var t = e.changedTouches[0], dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null; startY = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    if (dx < 0) { if (i < cards.length - 1) goTo(i + 1); } else if (i > 0) goTo(i - 1);
  }, { passive: true });

  window.setDeck = function (metaText) {
    try {
      var meta = JSON.parse(metaText || "{}");
      var list = Array.isArray(meta.cards) ? meta.cards : [];
      cards = list.map(function (c) { return { front: c && c.front, back: c && c.back }; });
      i = 0; flipped = false; grades = {}; done = false;
      draw();
      if (cards.length) report();
    } catch (e) {
      root.innerHTML = '<p class="msg">Could not display this deck.</p>';
    }
  };
})();
</script>
</body>
</html>
