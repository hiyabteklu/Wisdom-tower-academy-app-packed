name: Sync website reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: hiyabteklu/Wisdom-tower-academy
          ref: main
          path: _website_src

      - name: Copy snapshot into website-reference
        run: |
          SRC_SHA=$(git -C _website_src rev-parse HEAD)
          rm -rf website-reference
          mkdir website-reference
          rsync -a --max-size=1m \
            --include='.env.example' \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.next' \
            --exclude='.env*' --exclude='bun.lock' --exclude='*.lock' \
            --exclude='android-fcm' --exclude='google-services.json' \
            --exclude='*.jks' --exclude='*.keystore' \
            --exclude='*.pdf' --exclude='*.zip' --exclude='*.mp4' \
            _website_src/ website-reference/
          rm -rf _website_src
          cat > website-reference/READ_ME_FIRST.md <<EOF
          # Website reference snapshot (READ-ONLY)
          Source: hiyabteklu/Wisdom-tower-academy @ $SRC_SHA
          Synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Rules for agents:
          - Reference copy of the live website code. NOT part of the app build.
          - Never edit files here. It does not change the real website.
          - If the website needs a change, describe it in WEBSITE_CHANGES.md
            at the repo root (file path, exact code, reason).
          - Excluded: env files, Firebase config, keystores, lockfiles,
            PDFs/zips/videos, and files larger than 1 MB.
          EOF

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A website-reference
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync website reference snapshot [skip ci]"
            git push
          fi
